aid: blume
name: Blume
description: >-
  Blume is a women-owned self-care and skincare brand (blume.com) selling
  cleansers, serums, oils, gel creams, and sunscreen for acne, dark spots, and
  sensitive skin, marketed as vegan, certified clean, climate neutral, and
  plastic neutral. Its direct-to-consumer storefront runs on Shopify and exposes
  a genuine agent-native commerce surface: a canonical /agents.md, a Universal
  Commerce Protocol (UCP 2026-04-08) merchant profile at /.well-known/ucp, a live
  Model Context Protocol endpoint for agent-driven shopping (search, cart,
  checkout, fulfillment), and Shopify Customer Account OAuth2/OpenID Connect
  authentication. Surfaced from the 500 Global and Felicis portfolios and enriched
  by the API Evangelist pipeline from live discovery documents.
